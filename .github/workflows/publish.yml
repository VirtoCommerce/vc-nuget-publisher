name: Publish NuGet packages
run-name: "Publish ${{ inputs.repository }} run ${{ inputs.run_id }}"

# The only workflow with a nuget.org Trusted Publishing policy. Module workflows build the
# packages, upload them as an artifact and dispatch this workflow through
# VirtoCommerce/.github/actions/publish-nuget-central, then wait for it to finish.
on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Module repository that built the packages (owner/name)'
        required: true
        type: string
      run_id:
        description: 'Run in that repository that uploaded the packages'
        required: true
        type: string
      artifact_id:
        description: 'Artifact with the .nupkg and .snupkg files'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # A normal publish takes under a minute; the module waits for this run, up to 30 minutes.
    timeout-minutes: 15
    # The nuget.org policy names this environment, and the environment admits only main:
    # a run from any other branch gets no nuget.org key.
    environment: nuget-publish
    permissions:
      contents: read
      id-token: write
    env:
      SOURCE_REPO: ${{ inputs.repository }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
    steps:
      # Before the token is minted: the token is scoped to this repository name.
      - name: Check the inputs
        run: |
          fail() { echo "::error::$1"; exit 1; }

          [[ "$SOURCE_REPO" =~ ^${GITHUB_REPOSITORY_OWNER}/vc-module-[a-z0-9-]+$ ]] \
            || fail "Repository '$SOURCE_REPO' is not a ${GITHUB_REPOSITORY_OWNER}/vc-module-* repository."
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]] || fail "run_id '$SOURCE_RUN_ID' is not a number."
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]] || fail "artifact_id '$ARTIFACT_ID' is not a number."

      # The app is installed on all repositories of the org, so private modules and modules
      # created later need no setup. The token reaches the one module, with Actions: read only.
      - name: Get a token for the module repository
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.NUGET_PUBLISHER_APP_CLIENT_ID }}
          private-key: ${{ secrets.NUGET_PUBLISHER_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.repository }}
          permission-actions: read

      # The policy lets this workflow push any package of the owner, so publish only what a
      # module's own publishing workflow uploaded in a run that is still waiting for us.
      - name: Check the request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          fail() { echo "::error::$1"; exit 1; }

          RUN=$(gh api "repos/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID") || fail "Run $SOURCE_RUN_ID not found in $SOURCE_REPO."
          WORKFLOW=$(jq -r '.path | sub("^\\.github/workflows/"; "")' <<< "$RUN")
          BRANCH=$(jq -r '.head_branch' <<< "$RUN")
          EVENT=$(jq -r '.event' <<< "$RUN")
          STATUS=$(jq -r '.status' <<< "$RUN")
          HEAD_REPO=$(jq -r '.head_repository.full_name' <<< "$RUN")
          echo "Run $SOURCE_RUN_ID: $WORKFLOW on $BRANCH ($EVENT), $STATUS"

          # Any branch, as with the per-repo policies: which branches publish is the module workflow's
          # choice (the templates publish from main/master; some custom modules also from dev).
          case "$WORKFLOW" in
            module-ci.yml|publish-nugets.yml|module-release-hotfix.yml) ;;
            *) fail "Workflow '$WORKFLOW' may not publish NuGet packages." ;;
          esac
          [[ "$EVENT" == push || "$EVENT" == workflow_dispatch ]] || fail "Runs started by '$EVENT' may not publish."
          [[ "$HEAD_REPO" == "$SOURCE_REPO" ]] || fail "Run comes from '$HEAD_REPO', not from $SOURCE_REPO."
          [[ "$STATUS" == in_progress ]] || fail "Run is '$STATUS'; only a run that is waiting for the publish can request one."

          ARTIFACT=$(gh api "repos/$SOURCE_REPO/actions/artifacts/$ARTIFACT_ID") || fail "Artifact $ARTIFACT_ID not found in $SOURCE_REPO."
          [[ "$(jq -r '.workflow_run.id' <<< "$ARTIFACT")" == "$SOURCE_RUN_ID" ]] || fail "Artifact $ARTIFACT_ID was not uploaded by run $SOURCE_RUN_ID."

          {
            echo "### Publishing for [$SOURCE_REPO run $SOURCE_RUN_ID]($GITHUB_SERVER_URL/$SOURCE_REPO/actions/runs/$SOURCE_RUN_ID)"
            echo "Workflow \`$WORKFLOW\` on \`$BRANCH\` ($EVENT)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.artifact_id }}
          repository: ${{ inputs.repository }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ steps.app-token.outputs.token }}
          path: packages
          merge-multiple: true

      - name: List packages
        run: |
          shopt -s nullglob
          PACKAGES=(packages/*.nupkg)
          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "::error::The artifact has no .nupkg files."
            exit 1
          fi
          ls -l packages
          printf -- '- `%s`\n' "${PACKAGES[@]##*/}" >> "$GITHUB_STEP_SUMMARY"

      # Trusted Publishing: swap the GitHub OIDC token for a ~1h nuget.org key, minted right before push.
      - name: NuGet login (OIDC -> temp API key)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          # nuget.org user that created the trust policy (shared service account).
          user: virto

      # A .snupkg next to its .nupkg is pushed to the symbol server along with it.
      # --skip-duplicate: an existing version is not an error, as with vc-build PublishPackages.
      - name: Push packages
        env:
          NUGET_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_KEY" \
            --skip-duplicate
